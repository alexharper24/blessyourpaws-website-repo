<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex, nofollow">
<title>Editor &middot; Bless Your Paws</title>

</head>
<body>
<header class="top">
  <button class="menu" id="menu" aria-label="Sections" aria-expanded="false"><span></span><span></span><span></span></button>
  <a class="brand" href="/" aria-label="Bless Your Paws editor"><img src="/mark.png" alt="" width="34" height="34"><span>Bless Your Paws <em>editor</em></span></a>
  <a class="btn btn-primary publish-btn" href="#publish" id="publishTop">Publish</a>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections">
    <p class="rail-h">Every day</p>
    <a href="#puppies" data-view="puppies">Puppies <b id="nPuppies"></b></a>
    <a href="#publish" data-view="publish">Publish</a>
    <p class="rail-h">The dogs</p>
    <a href="#litters" data-view="litters">Litters <b id="nLitters"></b></a>

    <a href="#history" data-view="history">History</a>
    <a href="#people" data-view="people" id="peopleLink" hidden>People</a>

  </nav>

</div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">

    <h2 id="drawerTitle"></h2>
    <button class="x" id="drawerClose" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/admin.js?v=1" defer></script>
